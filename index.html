<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101416">
  <title>Sunset Run — Streetline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="device" aria-label="Streetline skateboarding game">
    <div class="screen">
      <canvas id="game" aria-label="Interactive skateboarding game scene"></canvas>
      <div class="grade"></div><div class="vignette"></div><div class="scanline"></div>
      <header class="top-hud">
        <section class="map-wrap">
          <div class="map" aria-label="Radar mini-map"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="58"/><path class="road" d="M-5 86 122 30M10-10 91 127M-5 45 125 82M36-5 48 125M-5 105 125 52"/><path class="minor" d="M5 19 116 101M5 112 114 8M18 60h90"/><path class="route" d="m35 91 19-17 8-20 23-10"/><path class="player" d="m60 48 8 15-8-3-8 3z"/></svg><span class="map-north">N</span></div>
          <div class="stats">
            <div class="stat"><span class="stat-icon heart">♥</span><span class="meter"><i class="hp"></i></span></div>
            <div class="stat"><span class="stat-icon shield">⬟</span><span class="meter"><i class="armor"></i></span></div>
            <div class="stat"><span class="stat-icon bolt">ϟ</span><span class="meter"><i class="stamina"></i></span></div>
          </div>
          <div class="district">PACIFIC BLUFFS <span>·</span> 14:32</div>
        </section>
        <section class="right-hud">
          <div class="money">$1,413,892</div>
          <div class="weapon"><span class="weapon-art">▰</span><span>micro SMG</span><b>24 <small>/ 120</small></b></div>
          <div class="wanted"><span class="wanted-label">WANTED</span><span class="star active">★</span><span class="star active">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
        </section>
      </header>
      <div class="mission"><span class="mission-pin">◆</span><div><small>ACTIVE OBJECTIVE</small><strong id="objective">LOSE THE POLICE</strong></div><b class="distance" id="distance">0.8 mi</b></div>
      <div class="toast" id="toast">KICKFLIP <b>+250</b></div>
      <div class="speed"><span id="speed">36</span><small>MPH</small><i></i></div>
      <div class="combo" id="combo">×1.0</div>
      <div class="control-layer">
        <div class="left-controls"><button class="stick" data-control="steer" aria-label="Steer"><span class="stick-ring"></span><span class="stick-knob"></span></button><span class="control-hint">STEER</span></div>
        <div class="right-controls">
          <button class="action shoot" data-control="shoot"><span class="crosshair">⌖</span><small>SHOOT</small></button>
          <button class="action camera" data-control="camera"><span>▣</span><small>CAMERA</small></button>
          <button class="action sprint" data-control="sprint"><span>»</span><small>SPRINT</small></button>
          <button class="action push" data-control="push"><span>➤</span><small>PUSH</small></button>
          <button class="action ollie" data-control="ollie"><span>↟</span><small>OLLIE</small></button>
          <button class="action trick" data-control="trick"><span>⟳</span><small>TRICK</small></button>
          <button class="action dismount" data-control="dismount"><span>↗</span><small>DISMOUNT</small></button>
        </div>
      </div>
      <div class="center-message" id="centerMessage">TAP TO RIDE</div>
      <footer class="bottom-hud"><span>▰ <b>STREETLINE</b></span><span class="hint">WASD / ARROWS MOVE <i>·</i> SPACE OLLIE <i>·</i> E PUSH <i>·</i> Q TRICK</span><span class="network"><i></i> ONLINE</span></footer>
      <div class="flash" id="flash"></div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
